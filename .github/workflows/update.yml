name: Update 4GTV Playlist

on:
  schedule:
    - cron: '0 */3 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Extraction Script Directly
        run: |
          python3 - << 'EOF'
          import datetime
          import subprocess
          import time
          import re
          from playwright.sync_api import sync_playwright

          # Pemetaan lengkap saluran beserta kata kunci unik untuk filternya
          CHANNELS_MAP = {
              "4gtv-4gtv003": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv003?set=1&ch=1", "keyword": "4gtv003"},
              "4gtv-4gtv001": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv001?set=1&ch=2", "keyword": "4gtv001"},
              "4gtv-4gtv002": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv002?set=1&ch=3", "keyword": "4gtv002"},
              "litv-ftv13": {"url": "https://www.4gtv.tv/channel/litv-ftv13?set=1&ch=31", "keyword": "ftv13"},
              "litv-ftv07": {"url": "https://www.4gtv.tv/channel/litv-ftv07?set=4&ch=61", "keyword": "ftv07"},
              "4gtv-live021": {"url": "https://www.4gtv.tv/channel/4gtv-live021", "keyword": "live021"},
              "4gtv-4gtv080": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv080?set=4&ch=124", "keyword": "4gtv080"},
              "4gtv-4gtv079": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv079?set=4&ch=189", "keyword": "4gtv079"},
              # Saluran Mozai & VOD (Memiliki pola khusus mozai)
              "mozai_ftv_variety": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv004?set=4&ch=16", "keyword": "mozai"},
              "mozai_chuko": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv006?set=4&ch=113", "keyword": "mozai"},
              "mozai_pts_drama": {"url": "https://www.4gtv.tv/channel/litv-ftv13?set=4&ch=31", "keyword": "mozai"},
              "mozai_ftv_drama": {"url": "https://www.4gtv.tv/channel/litv-ftv09?set=4&ch=24", "keyword": "mozai"},
              "vod_4gtv": {"url": "https://www.4gtv.tv/channel/fast-live241?set=4&ch=460", "keyword": "fast-live"}
          }

          CHANNEL_IDENTIFIERS = {
              "4gtv-4gtv003": "民視第一台",
              "4gtv-4gtv001": "民視台灣台",
              "4gtv-4gtv002": "民視",
              "litv-ftv13": "民視新聞台",
              "litv-ftv07": "民視旅遊台",
              "4gtv-live021": "經典電影台",
              "4gtv-4gtv080": "原住民族電視台",
              "4gtv-4gtv079": "Arrirang",
              "mozai_ftv_variety": "民視綜藝台",
              "mozai_chuko": "豬哥亮歌廳秀",
              "mozai_pts_drama": "公視戲劇",
              "mozai_ftv_drama": "民視影劇台",
              "vod_4gtv": "FastTV Variety"
          }

          try:
              with open("taiwan_4gtv.m3u", "r", encoding="utf-8") as f:
                  content = f.read()
          except Exception as e:
              print(f"Error reading m3u: {e}")
              content = ""

          captured_urls = {}
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
              page = context.new_page()

              for key, data in CHANNELS_MAP.items():
                  web_url = data["url"]
                  keyword = data["keyword"]
                  current_captured_url = None

                  def handle_req(request):
                      nonlocal current_captured_url
                      req_url = request.url
                      if ".m3u8" in req_url and "token=" in req_url:
                          # Aturan pencegah silang:
                          if keyword == "mozai":
                              # Jika saluran mozai, pastikan mengambil url mozai
                              if "mozai" in req_url:
                                  current_captured_url = req_url
                          else:
                              # Jika saluran biasa, JANGAN TANGKAP URL mozai yang generik
                              if "mozai" not in req_url and ("hinet.net" in req_url or "4gtv.tv" in req_url):
                                  current_captured_url = req_url

                  page.on("request", handle_req)
                  try:
                      print(f"Mengakses: {key} -> {web_url}")
                      page.goto(web_url, timeout=40000)
                      time.sleep(6)
                      try:
                          page.click("video, .jw-display-icon-container, .vjs-big-play-button", timeout=3000)
                      except:
                          pass
                      time.sleep(5)
                      if current_captured_url:
                          captured_urls[key] = current_captured_url
                          print(f"Berhasil dapat token untuk {key}")
                  except Exception as err:
                      print(f"Gagal untuk {key}: {err}")
                  
                  page.remove_listener("request", handle_req)
              browser.close()

          if captured_urls and content:
              lines = content.splitlines()
              new_lines = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  new_lines.append(line)
                  if line.startswith("#EXTINF"):
                      matched_key = None
                      for key, identifier in CHANNEL_IDENTIFIERS.items():
                          if identifier in line:
                              matched_key = key
                              break
                      if matched_key and matched_key in captured_urls:
                          if i + 1 < len(lines) and not lines[i + 1].startswith("#"):
                              new_lines.append(captured_urls[matched_key])
                              i += 2
                              continue
                  i += 1

              content = "\n".join(new_lines)
              timestamp_str = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
              content = re.sub(r'# Last Auto-Update:.*', f'# Last Auto-Update: {timestamp_str}', content)

              with open("taiwan_4gtv.m3u", "w", encoding="utf-8") as f:
                  f.write(content)

              subprocess.run(["git", "config", "--global", "user.name", "GitHub Actions Bot"], check=True)
              subprocess.run(["git", "config", "--global", "user.email", "actions@github.com"], check=True)
              subprocess.run(["git", "add", "taiwan_4gtv.m3u"], check=True)
              status = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True, check=True)
              if status.stdout.strip():
                  current_time = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
                  subprocess.run(["git", "commit", "-m", f"Auto-update unique tokens: {current_time}"], check=True)
                  subprocess.run(["git", "push"], check=True)
                  print("Berhasil memperbarui dan mem-push token unik baru!")
          EOF

      - name: Commit and Push Changes (Fallback)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update 4GTV playlist [skip ci]"
          branch: main
          file_pattern: taiwan_4gtv.m3u
