name: Update 4GTV Playlist Every 6 Hours

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          playwright install chromium

      - name: Run Auto Extractor Script Inline
        run: |
          python3 - << 'EOF'
          import datetime
          import time
          import re
          import subprocess
          from playwright.sync_api import sync_playwright

          CHANNELS = {
              "FTV Channel 1": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv003?set=1&ch=1", "keyword": "4gtv003"},
              "FTV Taiwan": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv001?set=1&ch=2", "keyword": "4gtv001"},
              "FTV TV": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv002?set=1&ch=3", "keyword": "4gtv002"},
              "FTV News": {"url": "https://www.4gtv.tv/channel/litv-ftv13?set=1&ch=31", "keyword": "ftv13"},
              "FTV Variety": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv004?set=4&ch=16", "keyword": "4gtv004"},
              "Chu Ko Liang": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv006?set=4&ch=113", "keyword": "4gtv006"},
              "FTV Travel": {"url": "https://www.4gtv.tv/channel/litv-ftv07?set=4&ch=61", "keyword": "ftv07"},
              "PTS Drama": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv042?set=4&ch=31", "keyword": "4gtv042"},
              "FTV Drama": {"url": "https://www.4gtv.tv/channel/litv-ftv09?set=4&ch=24", "keyword": "ftv09"},
              "Classic Movie": {"url": "https://www.4gtv.tv/channel/4gtv-live021", "keyword": "live021"},
              "FastTV Variety": {"url": "https://www.4gtv.tv/channel/fast-live241?set=4&ch=460", "keyword": "fast-live"},
              "Indigenous Peoples": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv080?set=4&ch=124", "keyword": "4gtv080"},
              "Arirang News": {"url": "https://www.4gtv.tv/channel/4gtv-4gtv079?set=4&ch=189", "keyword": "4gtv079"}
          }

          try:
              with open("taiwan_4gtv.m3u", "r", encoding="utf-8") as f:
                  content = f.read()
          except Exception as e:
              print(f"Gagal membaca file M3U: {e}")
              content = ""

          captured_urls = {}
          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True, args=["--disable-blink-features=AutomationControlled"])
              context = browser.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36")
              page = context.new_page()

              for name, data in CHANNELS.items():
                  web_url = data["url"]
                  keyword = data["keyword"]
                  result = {"url": None}  # Menggunakan dictionary untuk menghindari isu scope/nonlocal

                  def handle_req(request):
                      req_url = request.url
                      if "static-mozai" in req_url:
                          return
                      if ".m3u8" in req_url and "token=" in req_url and keyword in req_url:
                          result["url"] = req_url

                  page.on("request", handle_req)
                  try:
                      print(f"Mengakses: {name} -> {web_url}")
                      page.goto(web_url, timeout=40000)
                      time.sleep(4)
                      try:
                          page.click("video, .jw-display-icon-container, .vjs-big-play-button", timeout=2000)
                      except:
                          pass

                      # Polling loop menunggu iklan selesai (maksimal 35 detik)
                      start_wait = time.time()
                      while time.time() - start_wait < 35:
                          if result["url"]:
                              break
                          try:
                              page.click(".skip-button, .ad-skip, video", timeout=1000)
                          except:
                              pass
                          time.sleep(2)

                      if result["url"]:
                          captured_urls[name] = result["url"]
                          print(f"Berhasil mendapatkan token untuk {name}")
                      else:
                          print(f"Timeout menunggu token untuk {name}")
                  except Exception as err:
                      print(f"Error pada {name}: {err}")

                  page.remove_listener("request", handle_req)
              browser.close()

          if captured_urls and content:
              lines = content.splitlines()
              new_lines = []
              i = 0
              while i < len(lines):
                  line = lines[i]
                  new_lines.append(line)
                  if line.startswith("#EXTINF"):
                      matched_name = None
                      for ch_name in captured_urls.keys():
                          if ch_name in line:
                              matched_name = ch_name
                              break
                      if matched_name:
                          if i + 1 < len(lines) and not lines[i + 1].startswith("#"):
                              new_lines.append(captured_urls[matched_name])
                              i += 2
                              continue
                  i += 1

              content = "\n".join(new_lines)
              timestamp_str = datetime.datetime.utcnow().strftime("%Y-%m-%d %H:%M:%S UTC")
              content = re.sub(r'# Last Auto-Update:.*', f'# Last Auto-Update: {timestamp_str}', content)

              with open("taiwan_4gtv.m3u", "w", encoding="utf-8") as f:
                  f.write(content)

              subprocess.run(["git", "config", "--global", "user.name", "GitHub Actions Bot"], check=True)
              subprocess.run(["git", "config", "--global", "user.email", "actions@github.com"], check=True)
              subprocess.run(["git", "add", "taiwan_4gtv.m3u"], check=True)
              status = subprocess.run(["git", "status", "--porcelain"], capture_output=True, text=True, check=True)
              if status.stdout.strip():
                  subprocess.run(["git", "commit", "-m", f"Auto-update 4GTV tokens: {timestamp_str}"], check=True)
                  subprocess.run(["git", "push"], check=True)
                  print("Berhasil memperbarui dan mem-push file m3u ke GitHub!")
          else:
              print("Tidak ada token baru yang tertangkap.")
          EOF

      - name: Commit and Push Changes (Fallback)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update 4GTV playlist [skip ci]"
          branch: main
          file_pattern: taiwan_4gtv.m3u
