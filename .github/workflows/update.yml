name: Update 4GTV Playlist

on:
  schedule:
    # Menjalankan script otomatis setiap 6 jam sekali
    - cron: '0 */3 * * *'
  workflow_dispatch: # Memungkinkan tombol 'Run workflow' manual di GitHub

jobs:
  update-m3u:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Script
        run: python update_4gtv.py

      - name: Commit and Push Changes
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-update 4GTV playlist [skip ci]"
          branch: main
          file_pattern: taiwan_4gtv.m3u
